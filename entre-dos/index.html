<style>
/* Layout: una pantalla de celular para dos; ruleta o carta al centro, acciones abajo. Noche bordó, acentos rosa y dorado. */
:root{
  --noche:#2A0E1F; --noche-2:#14060E; --crema:#FFF1E6; --tinta:#2A0E1F; --rosa:#FF6F91; --oro:#F6D365; --fuego:#FF4B2B;
  --suave:rgba(255,241,230,.74); --linea:rgba(255,241,230,.18);
  --logo:"Bagel Fat One",system-ui,sans-serif; --display:"Fredoka","Segoe UI",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#4A1834 0%,var(--noche) 45%,var(--noche-2) 100%) fixed;background-color:var(--noche);color:var(--crema);font:17px/1.5 var(--body);overflow-x:hidden}
.app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 22px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:800 17px var(--body);border:0;border-radius:14px;padding:14px 20px;cursor:pointer;color:var(--tinta);background:var(--crema)}
button.rosa{background:var(--rosa);color:#2A0612}
button.oro{background:var(--oro);color:#2A1A00}
button.ghost{background:transparent;color:var(--crema);border:1.5px solid var(--linea)}
button.small{padding:9px 14px;font-size:15px;border-radius:10px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:400 22px var(--logo)}
.eyebrow{font:800 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.muted{color:var(--suave)}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1 1 160px}
.panel{background:rgba(255,241,230,.07);border:1px solid var(--linea);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}

/* aviso +18 */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}
.gate .age{width:96px;height:96px;border-radius:50%;border:3px solid var(--rosa);display:flex;align-items:center;justify-content:center;font:700 34px var(--display);color:var(--rosa)}
.gate p{max-width:30ch;margin:0}

/* inicio */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:6px}
.hero h1{font-size:clamp(52px,13vw,88px);line-height:.95}
.hero h1 span{color:var(--rosa)}
.hearts{display:flex;justify-content:center;padding-block:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font:700 14px var(--body);padding:8px 12px;border-radius:999px;background:rgba(255,241,230,.08)}

/* armado */
.field label{display:block;font-weight:800;margin-bottom:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text]{width:100%;font:600 17px var(--body);padding:12px 14px;border-radius:12px;border:1px solid var(--linea);background:rgba(0,0,0,.25);color:var(--crema)}
input::placeholder{color:rgba(255,241,230,.45)}
.opts{display:grid;gap:10px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.opts.three{grid-template-columns:1fr}}
.opt{text-align:left;background:transparent;color:var(--crema);border:1.5px solid var(--linea);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.opt b{font:700 18px var(--display);display:flex;align-items:center;gap:8px}
.opt span{font-weight:600;font-size:14px;opacity:.85}
.opt[aria-pressed="true"]{background:var(--crema);color:var(--tinta);border-color:var(--crema)}
.flames{display:inline-flex;gap:2px}

/* marcador */
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{border-radius:14px;padding:10px 12px;background:rgba(255,241,230,.07);border:2px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.score.on{border-color:var(--rosa);background:rgba(255,111,145,.16)}
.score b{font:700 16px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score span{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;display:inline-block}
.score small{display:block;font-size:12px;color:var(--suave);font-weight:700}
.score.bump span{animation:bump .8s}
@keyframes bump{30%{transform:scale(1.7)}}
.progress{height:5px;border-radius:3px;background:var(--linea);overflow:hidden}.progress i{display:block;height:100%;background:var(--rosa);transition:width .35s}
.turnline h2{font-size:clamp(26px,6vw,34px);animation:slideIn .5s cubic-bezier(.2,1.2,.4,1)}
.turnline h2 span{color:var(--rosa)}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}}

/* ruleta */
.wheelbox{position:relative;display:flex;justify-content:center;align-items:center;padding-top:10px}
.wheel{pointer-events:none;width:min(82vw,380px);height:min(82vw,380px);transition:transform 3.2s cubic-bezier(.15,.85,.2,1)}
.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--crema);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));z-index:2}
.hub{pointer-events:none;position:absolute;width:74px;height:74px;border-radius:50%;background:#14060E;border:4px solid var(--crema);display:flex;align-items:center;justify-content:center}
#spinBtn:not(:disabled){animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,111,145,.28)}}

/* carta */
.card{background:var(--crema);color:var(--tinta);border-radius:24px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.4);display:flex;flex-direction:column;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.card .band{background:var(--c);color:var(--bt,#2A0E1F);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;font:700 17px var(--display)}
.card .band small{background:rgba(0,0,0,.14);border-radius:999px;padding:4px 10px;font-size:13px}
.card .body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:clamp(30px,7vw,42px);line-height:1.06}
.card .tx{font-size:clamp(20px,4.6vw,24px);line-height:1.42;margin:0}
.rule{margin:0;font:700 15px var(--body);background:rgba(42,14,31,.07);border-radius:12px;padding:10px 14px}
.timer{display:flex;align-items:center;gap:14px;background:#14060E;color:var(--crema);border-radius:16px;padding:10px 14px}
.timer b{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:center}
.timer.low b{color:var(--rosa);animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.2)}}
.timer .bar{flex:1;height:10px;border-radius:5px;background:rgba(255,241,230,.15);overflow:hidden}.timer .bar i{display:block;height:100%;background:var(--oro);transition:width 1s linear}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{background:var(--t);color:#2A0E1F}
.note{font-size:14px;text-align:center;color:var(--suave);margin:0}

/* final */
.fin{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.fin h1{font-size:clamp(34px,8vw,52px)}
.vales{display:grid;gap:8px;margin:0;padding:0;list-style:none;width:100%}
.vales li{background:rgba(255,241,230,.08);border-radius:12px;padding:12px 14px;text-align:left;display:flex;justify-content:space-between;gap:10px}
.vales li span{color:var(--suave)}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:18px;background:rgba(255,241,230,.06);border-radius:14px;padding:13px 16px}
.rules i{flex:none;width:12px;height:28px;border-radius:6px;margin-top:2px}

.fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.cele{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;z-index:41;background:radial-gradient(circle,rgba(20,6,14,.55),transparent 60%)}
.cele b{font:700 clamp(80px,22vw,150px)/1 var(--display);color:var(--t);text-shadow:0 8px 0 rgba(0,0,0,.28);animation:celeIn .8s cubic-bezier(.2,1.6,.4,1) both}
.cele span{font:700 clamp(20px,5vw,30px) var(--display);background:var(--t);color:#2A0E1F;padding:8px 20px;border-radius:999px;animation:celeIn .8s .12s cubic-bezier(.2,1.6,.4,1) both}
.cele.out{animation:fadeOut .35s forwards}
@keyframes celeIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-30px)}}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--oro);color:#2A1A00;font:800 18px var(--display);padding:12px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;animation:pop .35s;white-space:nowrap}
.quit{position:fixed;inset:0;z-index:50;background:rgba(20,6,14,.78);display:flex;align-items:center;justify-content:center;padding:16px}
.quit .panel{background:#3A1429;max-width:380px;width:100%;text-align:center}
.demo{font-size:12px;text-align:center;color:var(--suave);margin:0}
@media (prefers-reduced-motion:reduce){.wheel{transition:none}.card,.toast,.cele b,.cele span,.score.bump span,.timer.low b,.turnline h2,#spinBtn{animation:none!important}}
</style>
<style>
#kgate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;
 background:#FFF6EC;font-family:Nunito,"DM Sans",system-ui,sans-serif;color:#141414}

 margin:0 auto 14px;font-family:"Bagel Fat One",Fredoka,system-ui;font-size:17px}

 text-transform:uppercase;padding:16px;border:2px solid #141414;border-radius:14px;background:#fff;color:#141414}

</style>


</head><body>
<div class="app" id="app"></div>


<div id="kgate"><div class="box">
 <div class="seal">Kermés</div>
 <h1>Entre Dos</h1>
 <p>Ingresá el código que recibiste al comprar.</p>
 <input id="kcode" placeholder="KERM-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
 <button id="kgo">Jugar</button>
 <div class="err" id="kerr"></div>
 <div class="alt">¿Todavía no lo tenés? <a href="../comprar/entre-dos/">Compralo acá</a><br>
 ¿Perdiste el código? <a href="../gracias/?juego=entre-dos">Recuperalo</a></div>
</div></div>
<script type="text/plain" id="kmain">
const CATS=DATA.categorias, CARDS=DATA.cartas;
const NIVEL={
  tibio:{n:"Tibio",f:1,d:"Para entrar en calor: recuerdos, risas y complicidad.",segs:["historia","adivina","confieso","reto","sorpresa"]},
  picante:{n:"Picante",f:2,d:"Suma coqueteo, besos y seducción.",segs:["historia","coqueteo","adivina","confieso","coqueteo","reto","sorpresa"]},
  fuego:{n:"Fuego",f:3,d:"La noche más íntima: deseos y retos a solas.",segs:["coqueteo","deseo","fuego","adivina","fuego","confieso","deseo","sorpresa"]}
};
const LEN={corta:{n:"Corta",d:"12 turnos · 20 min",t:12},normal:{n:"Normal",d:"20 turnos · 35 min",t:20},larga:{n:"Larga",d:"30 turnos · 50 min",t:30}};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const $=s=>document.querySelector(s);
const app=$("#app");
const KMARK=`<svg width="30" height="30" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="198" fill="#141414"/><g transform="rotate(-62 200 170)"><rect x="190" y="30" width="22" height="48" rx="11" fill="#2EC4B6"/></g><g transform="rotate(-20 200 170)"><rect x="190" y="26" width="20" height="40" rx="10" fill="#FF7A5C"/></g><g transform="rotate(24 200 170)"><rect x="190" y="26" width="22" height="44" rx="11" fill="#FFB020"/></g><g transform="rotate(62 200 170)"><rect x="190" y="30" width="20" height="40" rx="10" fill="#FF4F8B"/></g><text x="200" y="272" text-anchor="middle" font-family="Bagel Fat One, sans-serif" font-size="230" fill="#FFF6E9">K</text></svg>`;
const FLAME=`<svg width="14" height="16" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1c1 5 7 8 7 15a7 7 0 0 1-14 0c0-4 2-6 3-8 0 3 1 5 3 5 0-5-1-8 1-12z" fill="currentColor"/></svg>`;
const flames=n=>`<span class="flames">${FLAME.repeat(n)}</span>`;
const HEARTS=`<svg width="150" height="96" viewBox="0 0 150 96" aria-hidden="true"><path d="M52 88C20 66 4 50 4 30 4 16 15 6 28 6c10 0 18 6 24 14C58 12 66 6 76 6c13 0 24 10 24 24 0 20-16 36-48 58z" fill="#FF6F91"/><path d="M98 88C66 66 50 50 50 30 50 16 61 6 74 6c10 0 18 6 24 14 6-8 14-14 24-14 13 0 24 10 24 24 0 20-16 36-48 58z" fill="#F6D365" opacity=".92" style="mix-blend-mode:screen"/></svg>`;
const topBar=(right="")=>`<div class="top"><div class="brand">${KMARK}<span>kermés</span></div>${right}</div>`;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let adult=false; try{adult=sessionStorage.getItem("entredos18")==="1"}catch(e){}
let S={screen:adult?"home":"gate",sound:true,voz:true,nivel:"picante",len:"normal",names:["",""],p:[],turn:0,turns:0,used:new Set(),rot:0,segs:[],card:null,both:false,choose:false,vales:[],timer:null,bump:-1};
let tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
const player=new Audio();player.preload="auto";
function say(f){try{player.pause();if(!S.voz)return;player.src="audio/"+f;player.currentTime=0;player.play().catch(()=>{});}catch(e){}}
function render(){stopTimer();try{player.pause()}catch(e){}({gate,home,setup,rules,spin,card,cierre,fin})[S.screen]();S.bump=-1;window.scrollTo(0,0);}

const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let AC=null;
function snd(type){ if(!S.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume();
  const seq={tick:[[1100,.025]],win:[[523,.11],[659,.11],[784,.11],[1047,.28]],soft:[[660,.12],[880,.24]],beep:[[1250,.07]],fan:[[523,.14],[659,.14],[784,.14],[1047,.14],[784,.1],[1047,.6]],buzz:[[160,.5]]}[type]||[];
  let t=AC.currentTime; seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==="buzz"?"sawtooth":"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==="tick"?.1:.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.92;}); }catch(e){} }
function hearts(colors,count=60,rain=false,dur=2600){ if(RM) return;
  const cv=document.createElement("canvas");cv.className="fx";document.body.append(cv);const W=cv.width=innerWidth,H=cv.height=innerHeight;const x=cv.getContext("2d");
  const P=Array.from({length:count},()=>rain?{x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*1.5,vy:1.5+Math.random()*2.5}:{x:W/2,y:H*.45,vx:(Math.random()-.5)*14,vy:-5-Math.random()*11}).map(p=>Object.assign(p,{r:(Math.random()-.5)*.6,s:8+Math.random()*12,c:colors[Math.floor(Math.random()*colors.length)]}));
  const heart=(s)=>{x.beginPath();x.moveTo(0,s*.3);x.bezierCurveTo(0,0,-s*.5,0,-s*.5,s*.3);x.bezierCurveTo(-s*.5,s*.6,0,s*.8,0,s);x.bezierCurveTo(0,s*.8,s*.5,s*.6,s*.5,s*.3);x.bezierCurveTo(s*.5,0,0,0,0,s*.3);x.fill();};
  const t0=performance.now();(function fr(t){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=rain?.02:.3;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;heart(p.s);x.restore();});
   if(t-t0<dur)requestAnimationFrame(fr);else cv.remove();})(t0);}
function celebrate(big,sub,color){
  const d=document.createElement("div");d.className="cele";d.style.setProperty("--t",color||"#FF6F91");d.innerHTML=`<b>${esc(big)}</b>${sub?`<span>${esc(sub)}</span>`:""}`;document.body.append(d);
  setTimeout(()=>d.classList.add("out"),1150);setTimeout(()=>d.remove(),1550);
  hearts([color||"#FF6F91","#FFF1E6","#F6D365"],70); snd("win");
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1800)}
const name=i=>S.p[i].name, other=i=>1-i;

function gate(){
  app.innerHTML=`${topBar()}<div class="gate"><div class="age">+18</div><h1>Entre Dos es para parejas adultas</h1>
   <p class="muted">Tiene cartas de coqueteo e intimidad. Para jugar, los dos tienen que ser mayores de 18 y querer jugar.</p>
   <div class="actions" style="width:100%;max-width:420px"><button class="rosa" id="yes">Sí, somos mayores de 18</button><button class="ghost" id="no">No</button></div></div>`;
  $("#yes").onclick=()=>{try{sessionStorage.setItem("entredos18","1")}catch(e){}S.screen="home";render();};
  $("#no").onclick=()=>{app.querySelector(".gate").innerHTML=`<div class="age">+18</div><h1>Este juego no es para vos</h1><p class="muted">Si buscás algo para jugar en familia, mirá Alta Charla en @kermes_juegos.</p>`;};
}

function home(){
  app.innerHTML=`${topBar(`<span style="display:flex;gap:8px"><button class="ghost small" id="voz" aria-pressed="${S.voz}">Voz: ${S.voz?"sí":"no"}</button><button class="ghost small" id="snd" aria-pressed="${S.sound}">Sonido: ${S.sound?"sí":"no"}</button></span>`)}
   <div class="hero"><div class="hearts">${HEARTS}</div>
    <div class="eyebrow">Juego para parejas · +18</div>
    <h1>Entre <span>Dos</span></h1>
    <p class="muted" style="margin:0;font-size:19px">Una ruleta, cien cartas y una noche para conocerse más, reírse y animarse a un poco más.</p>
    <div class="chips"><span class="chip">2 jugadores</span><span class="chip">3 niveles</span><span class="chip">20 a 50 min</span><span class="chip">Siempre se puede pasar</span></div></div>
   <button class="rosa" id="go">Armar la noche</button>
   <p class="demo">Kermés · juegos para charlar</p>`;
  $("#go").onclick=()=>{S.screen="setup";render()};
  $("#snd").onclick=e=>{S.sound=!S.sound;render()};
  $("#voz").onclick=e=>{S.voz=!S.voz;render()};
}

function setup(){
  app.innerHTML=`${topBar()}<h1 style="font-size:32px">Armen la noche</h1>
   <div class="field"><label>¿Cómo se llaman?</label><div class="names">
    <input type="text" id="n0" maxlength="14" placeholder="Jugador 1" value="${esc(S.names[0])}">
    <input type="text" id="n1" maxlength="14" placeholder="Jugador 2" value="${esc(S.names[1])}"></div></div>
   <div class="field"><label>¿Qué tan picante?</label><div class="opts three">${Object.entries(NIVEL).map(([k,v])=>`<button class="opt" data-n="${k}" aria-pressed="${S.nivel===k}"><b>${v.n} ${flames(v.f)}</b><span>${v.d}</span></button>`).join("")}</div></div>
   <div class="field"><label>¿Cuánto dura?</label><div class="opts three">${Object.entries(LEN).map(([k,v])=>`<button class="opt" data-l="${k}" aria-pressed="${S.len===k}"><b>${v.n}</b><span>${v.d}</span></button>`).join("")}</div></div>
   <div class="actions"><button class="ghost" id="back">Volver</button><button class="rosa" id="next">Ver las reglas</button></div>`;
  const keep=()=>{S.names=[$("#n0").value.trim(),$("#n1").value.trim()]};
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{keep();S.nivel=b.dataset.n;render()});
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{keep();S.len=b.dataset.l;render()});
  $("#back").onclick=()=>{keep();S.screen="home";render()};
  $("#next").onclick=()=>{keep();S.screen="rules";render()};
}

function rules(){
  const R=[["#FF6F91","Por turno, cada uno gira la ruleta. Donde frena, sale una carta de esa categoría."],
   ["#F6D365","Juega quien giró, salvo que la carta diga <b>Los dos</b>."],
   ["#4FC3B8","Cada carta que cumplen se la lleva quien la jugó. En <b>Adiviná</b>, solo si acierta."],
   ["#B98CF2","Cada uno tiene <b>3 comodines de silencio</b> para pasar una carta sin explicar nada."],
   ["#FF4B2B","Siempre vale decir que no. Si una carta no les pinta, la cambian o la dejan para otro día."],
   ["#FFF1E6","Al final, quien juntó más cartas elige la próxima cita. Los vales que ganen quedan guardados."]];
  app.innerHTML=`${topBar()}<h1 style="font-size:32px">Cómo se juega</h1>
   <ul class="rules">${R.map(([c,t])=>`<li><i style="background:${c}"></i><span>${t}</span></li>`).join("")}</ul>
   <div class="actions"><button class="ghost" id="back">Volver</button><button class="rosa" id="start">¡Empezar!</button></div>`;
  $("#back").onclick=()=>{S.screen="setup";render()};
  $("#start").onclick=start;
}
function start(){
  S.p=[0,1].map(i=>({name:S.names[i]||("Jugador "+(i+1)),cartas:0,silencio:3,doble:false}));
  S.turn=Math.random()<.5?0:1;S.turns=0;S.used=new Set();S.vales=[];S.both=false;S.choose=false;
  S.segs=NIVEL[S.nivel].segs.slice();S.screen="spin";render();say("intro.mp3");
}
function header(){
  const pct=Math.min(100,S.turns/LEN[S.len].t*100);
  return `${topBar(`<span style="display:flex;align-items:center;gap:10px"><span class="eyebrow">${NIVEL[S.nivel].n} ${flames(NIVEL[S.nivel].f)}</span><button class="ghost small" data-voz aria-pressed="${S.voz}" aria-label="Voz">${S.voz?"🔊":"🔇"}</button><button class="ghost small" data-quit>Terminar</button></span>`)}
   <div class="board">${S.p.map((p,i)=>`<div class="score${i===S.turn?" on":""}${S.bump===i?" bump":""}"><div><b>${esc(p.name)}</b><small>Silencios: ${p.silencio}${p.doble?" · Doble":""}</small></div><span>${p.cartas}</span></div>`).join("")}</div>
   <div class="progress" aria-label="Avance de la partida"><i style="width:${pct}%"></i></div>`;
}
function wheelSVG(){
  const n=S.segs.length,r=190;let s="";
  S.segs.forEach((k,i)=>{const a0=(i*360/n-90)*Math.PI/180,a1=((i+1)*360/n-90)*Math.PI/180,am=((i+.5)*360/n-90);
    s+=`<path d="M200 200 L${200+r*Math.cos(a0)} ${200+r*Math.sin(a0)} A${r} ${r} 0 0 1 ${200+r*Math.cos(a1)} ${200+r*Math.sin(a1)} Z" fill="${CATS[k].color}" stroke="#2A0E1F" stroke-width="3"/>`;
    const label=CATS[k].nombre.replace("Lo que no te dije","Confesiones").replace("Retos de a dos","Retos").replace("Nuestra historia","Historia");
    s+=`<text x="${200+120}" y="200" transform="rotate(${am} 200 200)" text-anchor="middle" dominant-baseline="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="17" fill="${k==="fuego"||k==="deseo"?"#FFF1E6":"#2A0E1F"}">${esc(label)}</text>`;});
  return `<svg class="wheel" id="wheel" viewBox="0 0 400 400" style="transform:rotate(${S.rot}deg)" role="img" aria-label="Ruleta de categorías"><circle cx="200" cy="200" r="198" fill="#2A0E1F"/>${s}</svg>`;
}
function spin(){
  const who=S.both?`<span>Los dos</span>`:`Le toca a <span>${esc(name(S.turn))}</span>`;
  if(S.choose){
    const opts=[...new Set(S.segs)].filter(k=>k!=="sorpresa");
    app.innerHTML=`${header()}<div class="turnline"><h2>${esc(name(S.turn))} elige la categoría</h2></div>
     <div class="pick">${opts.map(k=>`<button style="--t:${CATS[k].color}" data-k="${k}">${esc(CATS[k].nombre)}</button>`).join("")}</div>`;
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.choose=false;draw(b.dataset.k)});
    return;
  }
  app.innerHTML=`${header()}<div class="turnline"><h2>${who}</h2></div>
   <div class="wheelbox"><span class="pointer"></span>${wheelSVG()}<span class="hub">${KMARK.replace('width="30" height="30"','width="56" height="56"')}</span></div>
   <button class="rosa" id="spinBtn">Girar la ruleta</button>`;
  $("#spinBtn").onclick=()=>{
    $("#spinBtn").disabled=true;
    const n=S.segs.length,idx=Math.floor(Math.random()*n),target=360-((idx+.5)*360/n),cur=((S.rot%360)+360)%360;
    S.rot+=360*5+((target-cur+360)%360)+(Math.random()-.5)*(360/n)*.6;
    $("#wheel").style.transform=`rotate(${S.rot}deg)`;
    if(!RM){let gap=40,el=0;const tk=()=>{snd("tick");el+=gap;gap*=1.12;if(el<3000)setTimeout(tk,gap)};tk();}
    setTimeout(()=>{snd("beep");draw(S.segs[idx])},RM?150:3300);
  };
}
function draw(cat){
  let pool=CARDS.filter(c=>c.cat===cat&&!c.cierre&&!S.used.has(c.id));
  if(!pool.length){CARDS.filter(c=>c.cat===cat).forEach(c=>S.used.delete(c.id));pool=CARDS.filter(c=>c.cat===cat&&!c.cierre);}
  const c=shuffle(pool)[0];S.used.add(c.id);S.card=c;S.timer=c.tiempo?{left:c.tiempo,run:false}:null;
  S.screen="card";render();
}
// Personaliza "tu pareja" con el nombre del otro jugador
function personal(t,i,dos){ if(dos) return esc(t); const n=esc(name(other(i)));
  return esc(t).replace(/^Tu pareja/,n).replace(/([.?!:]\s)Tu pareja/g,"$1"+n).replace(/a tu pareja/g,"a "+n).replace(/de tu pareja/g,"de "+n).replace(/tu pareja/g,n); }
function timerHTML(){if(!S.timer)return "";const t=S.timer,tot=S.card.tiempo;
  return `<div class="timer${t.left<=5&&t.run?" low":""}" id="timer"><b>${t.left}</b><div class="bar"><i style="width:${t.left/tot*100}%"></i></div><button class="oro small" id="tgo">${t.run?"Pausa":(t.left<tot?"Seguir":"Arrancar")}</button></div>`;}
function card(){
  const c=S.card,cat=CATS[c.cat],i=S.turn,dos=S.both||c.dos;
  const who=dos?"Juegan los dos":`Juega ${name(i)}`;
  const light=c.cat==="sorpresa";
  let acts="";
  if(c.cat==="sorpresa"&&!c.cierre){acts=`<button class="rosa" id="ok">${c.efecto==="vale"?"¡Guardar el vale!":"¡Dale!"}</button>`;}
  else if(c.gana){acts=`<button class="rosa" id="win">¡Acertó!</button><button class="ghost" id="miss">No acertó</button>`;}
  else{acts=`<button class="rosa" id="done">${dos?"¡Lo hicimos!":"¡Hecho!"}</button>`;}
  const canPass=c.cat!=="sorpresa";
  const passer=dos?null:i;
  app.innerHTML=`${header()}
   <article class="card" style="--c:${cat.color};--bt:${light?"#2A0E1F":(c.cat==="fuego"||c.cat==="deseo"?"#FFF1E6":"#2A0E1F")}">
    <div class="band"><span>${esc(cat.nombre)}</span><small>${esc(who)}</small></div>
    <div class="body"><h2>${esc(c.t)}</h2><p class="tx">${personal(c.x,i,dos)}</p>
     ${c.gana?`<p class="rule">${esc(c.gana)}</p>`:""}
     ${timerHTML()}</div></article>
   <div class="actions">${acts}</div>
   ${canPass?`<button class="ghost" id="pass" ${passer!==null&&S.p[passer].silencio<1?"disabled":""}>${passer===null?"Pasar esta carta":`Usar un silencio (${S.p[passer].silencio})`}</button>`:""}
   ${S.voz?`<button class="ghost small" id="again" style="align-self:center">Escuchar de nuevo</button>`:""}
   ${canPass?`<p class="note">Si no les pinta, pasan. Sin explicar nada.</p>`:""}`;
  say("c"+c.id+".mp3"); if($("#again"))$("#again").onclick=()=>say("c"+c.id+".mp3");
  if(S.timer){const go=()=>{const t=S.timer;if(t.run){t.run=false;stopTimer();upd();return}t.run=true;upd();
      tick=setInterval(()=>{t.left--;if(t.left<=5&&t.left>0)snd("beep");if(t.left<=0){t.left=0;t.run=false;stopTimer();snd("buzz");toast("¡Tiempo!");}upd();},1000)};
    const upd=()=>{const el=$("#timer");if(el)el.outerHTML=timerHTML();const b=$("#tgo");if(b)b.onclick=go;};
    $("#tgo").onclick=go;}
  const earn=(who,n=1)=>{const p=S.p[who];const m=p.doble?2:1;p.cartas+=n*m;p.doble=false;S.bump=who;return n*m};
  if($("#done"))$("#done").onclick=()=>{ if(dos){earn(0);earn(1);celebrate("+1","Para los dos","#FF6F91");} else {const k=earn(i);celebrate("+"+k,name(i),"#FF6F91");} after(); };
  if($("#win"))$("#win").onclick=()=>{const k=earn(i);celebrate("+"+k,name(i)+" acertó","#4FC3B8");after();};
  if($("#miss"))$("#miss").onclick=()=>{snd("soft");toast("Será la próxima");after();};
  if($("#pass"))$("#pass").onclick=()=>{if(passer!==null)S.p[passer].silencio--;snd("soft");toast("Carta pasada");after();};
  if($("#ok"))$("#ok").onclick=()=>effect(c);
}
function effect(c){
  const i=S.turn,p=S.p[i];
  switch(c.efecto){
    case "elegir": S.both=false;S.choose=true;S.screen="spin";render();return;
    case "otra": S.both=false;toast("¡Otra vez "+name(i)+"!");S.screen="spin";render();return;
    case "dos": S.both=true;toast("La próxima es para los dos");break;
    case "doble": p.doble=true;toast("Tu próxima carta vale doble");break;
    case "silencio": p.silencio++;toast("+1 silencio para "+name(i));break;
    case "vale": S.vales.push({t:c.t,de:name(i)});celebrate("Vale",name(i),"#F6D365");break;
    default: break;
  }
  after(c.efecto==="dos");
}
function after(keepBoth){
  if(!keepBoth)S.both=false;
  S.turns++;S.turn=other(S.turn);
  if(S.turns>=LEN[S.len].t){S.screen="cierre";setTimeout(render,RM?0:900);return;}
  S.screen="spin";setTimeout(render,RM?0:900);
}
function cierre(){
  const c=CARDS.find(x=>x.cierre);
  app.innerHTML=`${topBar()}
   <article class="card" style="--c:#F6D365"><div class="band"><span>Última carta</span><small>Juegan los dos</small></div>
    <div class="body"><h2>${esc(c.t)}</h2><p class="tx">${esc(c.x)}</p></div></article>
   <button class="rosa" id="fin">Ver cómo terminó</button>`;
  say("c"+c.id+".mp3");
  $("#fin").onclick=()=>{S.screen="fin";render()};
}
function fin(){
  const [a,b]=S.p,tie=a.cartas===b.cartas,w=a.cartas>b.cartas?a:b;
  app.innerHTML=`${topBar()}<div class="fin"><div class="hearts">${HEARTS}</div>
   <div class="eyebrow">${esc(a.name)} ${a.cartas} · ${esc(b.name)} ${b.cartas}</div>
   <h1>${tie?"¡Empate!":`¡Ganó ${esc(w.name)}!`}</h1>
   <p class="muted" style="margin:0;font-size:19px">${tie?"La próxima cita la eligen juntos.":`${esc(w.name)} elige la próxima cita.`}</p>
   ${S.vales.length?`<div class="panel" style="width:100%"><h3>Vales para usar</h3><ul class="vales">${S.vales.map(v=>`<li><b>${esc(v.t)}</b><span>de ${esc(v.de)}</span></li>`).join("")}</ul><p class="note" style="text-align:left">Sáquenle captura para no olvidarlos.</p></div>`:""}
   <div class="actions" style="width:100%"><button class="ghost" id="home">Inicio</button><button class="rosa" id="again">Jugar otra vez</button></div></div>`;
  snd("fan");hearts(["#FF6F91","#F6D365","#FFF1E6"],120,true,4200);
  $("#home").onclick=()=>{S.screen="home";render()};
  $("#again").onclick=()=>{S.screen="setup";render()};
}
document.addEventListener("click",e=>{
  const vb=e.target.closest("[data-voz]"); if(vb){S.voz=!S.voz;vb.textContent=S.voz?"🔊":"🔇";vb.setAttribute("aria-pressed",S.voz);if(!S.voz)player.pause();else if(S.screen==="card")say("c"+S.card.id+".mp3");return;}
  if(e.target.closest("[data-quit]")){stopTimer();const d=document.createElement("div");d.className="quit";
    d.innerHTML=`<div class="panel"><h3 style="font-size:24px">¿Terminan la partida?</h3><p class="muted" style="margin:0">Pueden cerrar con la última carta y ver quién ganó, o volver al inicio.</p>
     <button class="rosa" data-q="fin">Terminar y ver el resultado</button><button class="ghost" data-q="home">Salir al inicio</button><button class="ghost" data-q="no">Seguir jugando</button></div>`;
    document.body.append(d);return;}
  const q=e.target.closest("[data-q]"); if(!q) return; document.querySelector(".quit")?.remove();
  if(q.dataset.q==="fin"){S.both=false;S.choose=false;S.screen="cierre";render();}
  else if(q.dataset.q==="home"){S.screen="home";render();}
  else if(S.screen==="card"&&S.timer){S.timer.run=false;render();}
});
render();
</script>
<script>
(function(){
 const API="https://uajwwdvlybambkawcngq.supabase.co/functions/v1", SLUG="entre-dos", KEY="kermes_"+SLUG;
 const inp=document.getElementById("kcode"), btn=document.getElementById("kgo"), err=document.getElementById("kerr");
 const q=new URLSearchParams(location.search).get("c");
 let saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
 if(q){inp.value=q; history.replaceState(null,"",location.pathname)} else if(saved) inp.value=saved;
 async function go(){
  const codigo=inp.value.trim().toUpperCase(); if(!codigo){err.textContent="Escribí tu código.";return}
  btn.disabled=true; btn.textContent="Abriendo…"; err.textContent="";
  try{
   const r=await fetch(API+"/jugar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({codigo,juego:SLUG})});
   const j=await r.json();
   if(!r.ok) throw new Error(j.error||"Código no válido");
   try{localStorage.setItem(KEY,codigo)}catch(e){}
   const s=document.createElement("script");
   s.textContent="const DATA="+JSON.stringify(j.data)+";\n"+document.getElementById("kmain").textContent;
   document.body.appendChild(s);
   document.getElementById("kgate").remove();
  }catch(e){err.textContent=e.message||"No pudimos validar el código."; btn.disabled=false; btn.textContent="Jugar"}
 }
 btn.onclick=go; inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
 if(q||saved) go();
})();
</script>
